name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes (node --test)
        run: node --test

  testes-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: invflow_teste
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrações e testes de acesso (supabase/tests/rls.sql)
        env:
          DATABASE_URL: postgres://postgres:teste@localhost:5432/invflow_teste
        run: supabase/tests/rodar-local.sh

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [testes, testes-sql]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar a pasta do site (só o que o navegador precisa)
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/
          touch _site/.nojekyll
          scripts/carimbar-versao.sh _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Às vezes o GitHub ainda não "enxerga" o pacote recém-enviado e a
      # publicação falha com "No artifacts named github-pages". Espera e tenta de novo.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Esperar antes de tentar de novo
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
