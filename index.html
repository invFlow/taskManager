<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>InvFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/estilos/base.css">
  <script type="module" src="src/main.js"></script>
</head>
<body data-estado="carregando">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="#/minhas" aria-label="InvFlow, início">
      <span class="marca-icone" aria-hidden="true">✓</span>
      <span>InvFlow</span>
    </a>
    <nav id="menu" class="menu" aria-label="Principal"></nav>
    <div class="acoes">
      <button id="botao-nova" class="botao botao-primario" type="button">+ Nova</button>
      <a id="botao-perfil" class="botao botao-icone botao-perfil" href="#/perfil" data-rota="perfil" aria-label="Perfil" title="Perfil">
        <span class="iniciais" aria-hidden="true"></span>
      </a>
    </div>
  </header>
  <main id="conteudo" class="conteudo" tabindex="-1">
    <p class="texto-suave carregando">Carregando...</p>
    <noscript><p>O InvFlow precisa de JavaScript ativado.</p></noscript>
  </main>
  <div id="aviso" class="aviso" role="status" hidden></div>
</body>
</html>
